name: Validate PR 16614 review cleanup
on:
  push:
    branches: [validation/pr16614-review-cleanup-20260917]
    paths: [.github/workflows/pr16614-review-cleanup.yml]
permissions:
  contents: read
concurrency:
  group: pr16614-review-cleanup
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'sankalpsthakur/qiskit'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      QISKIT_BUILD_PROFILE: debug
      QISKIT_PARALLEL: 'FALSE'
      QISKIT_IGNORE_USER_SETTINGS: 'TRUE'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5df5da5319f5a8e6abbd73b124f076b4dca88ee
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply only the reviewed test cleanup
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = b5df5da5319f5a8e6abbd73b124f076b4dca88ee
          test "$(git hash-object test/python/circuit/test_commutation_checker.py)" = 01c11c1f12484fa4ea2567e44c3183c5feaf2103
          cat > "$RUNNER_TEMP/cleanup.patch" <<'PATCH'
          diff --git a/test/python/circuit/test_commutation_checker.py b/test/python/circuit/test_commutation_checker.py
          --- a/test/python/circuit/test_commutation_checker.py
          +++ b/test/python/circuit/test_commutation_checker.py
          @@ -647,29 +647,28 @@
                   with self.subTest(left=x, right=swap):
                       self.assertFalse(scc.commute(x, [1], [], swap, [1, 0], []))
           
          -    def test_reject_duplicate_qubits(self):
          +    @data(
          +        (
          +            PauliEvolutionGate(SparsePauliOp(["XXI", "IXI", "IIZ"]), time=42.2),
          +            [0, 2, 2],
          +            PauliProductRotationGate(Pauli("XX"), 0.1),
          +            [1, 2],
          +            "qargs1",
          +        ),
          +        (
          +            PauliProductRotationGate(Pauli("XX"), 0.1),
          +            [1, 2],
          +            PauliEvolutionGate(SparsePauliOp(["XXI", "IXI", "IIZ"]), time=42.2),
          +            [0, 2, 2],
          +            "qargs2",
          +        ),
          +    )
          +    @unpack
          +    def test_reject_duplicate_qubits(self, op1, qargs1, op2, qargs2, duplicate_arg):
                   """Test that duplicate qubit arguments are rejected without panicking."""
                   checker = CommutationChecker()
          -        evolution = PauliEvolutionGate(SparsePauliOp(["XXI", "IXI", "IIZ"]), time=42.2)
          -        rotation = PauliProductRotationGate(Pauli("XX"), 0.1)
          -        cases = [
          -            (evolution, [0, 2, 2], rotation, [1, 2], "qargs1"),
          -            (rotation, [1, 2], evolution, [0, 2, 2], "qargs2"),
          -        ]
          -
          -        for op1, qargs1, op2, qargs2, duplicate_arg in cases:
          -            with self.subTest(duplicate_arg=duplicate_arg, check_inputs=True):
          -                with self.assertRaisesRegex(
          -                    QiskitError, rf"{duplicate_arg} contains duplicate qubits"
          -                ):
          -                    checker.commute(op1, qargs1, [], op2, qargs2, [])
          -            with self.subTest(duplicate_arg=duplicate_arg, check_inputs=False):
          -                # Use a gate filter so the core path returns early without remapping,
          -                # which would panic on duplicate qargs when validation is skipped.
          -                filtered = CommutationChecker(gates={"x"})
          -                self.assertFalse(
          -                    filtered.commute(op1, qargs1, [], op2, qargs2, [], check_inputs=False)
          -                )
          +        with self.assertRaisesRegex(QiskitError, rf"{duplicate_arg} contains duplicate qubits"):
          +            checker.commute(op1, qargs1, [], op2, qargs2, [])
           
               def test_pauli_evolution_parameterized(self):
                   """Test PauliEvolutionGate commutations for parameterized times."""
          PATCH
          git apply --check "$RUNNER_TEMP/cleanup.patch"
          git apply "$RUNNER_TEMP/cleanup.patch"
          git diff --check
          test "$(git diff --name-only)" = test/python/circuit/test_commutation_checker.py
          python -m py_compile test/python/circuit/test_commutation_checker.py
      - name: Build exact source with project test and lint dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          python -m pip install --upgrade pip
          python -m pip install -c constraints.txt -e . --group test --group lint
      - name: Format and lint the changed test file
        run: |
          black --check test/python/circuit/test_commutation_checker.py
          ruff check test/python/circuit/test_commutation_checker.py
      - name: Run commutation checker and optimization tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest -v test.python.circuit.test_commutation_checker test.python.transpiler.test_commutative_optimization 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Publish tested patch and evidence
        uses: actions/upload-artifact@v4
        with:
          name: pr16614-tested-cleanup
          path: |
            ${{ runner.temp }}/cleanup.patch
            ${{ runner.temp }}/tests.log
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: validate
    if: github.repository == 'sankalpsthakur/qiskit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b5df5da5319f5a8e6abbd73b124f076b4dca88ee
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: pr16614-tested-cleanup
          path: ${{ runner.temp }}/tested-cleanup
      - name: Fast-forward the original PR branch only after validation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected=b5df5da5319f5a8e6abbd73b124f076b4dca88ee
          branch=fix-commutation-checker-duplicate-qargs
          actual=$(gh api "repos/sankalpsthakur/qiskit/git/ref/heads/$branch" --jq .object.sha)
          test "$actual" = "$expected" || { echo 'PR head moved; no update made.'; exit 1; }
          test "$(git hash-object test/python/circuit/test_commutation_checker.py)" = 01c11c1f12484fa4ea2567e44c3183c5feaf2103
          git apply --check "$RUNNER_TEMP/tested-cleanup/cleanup.patch"
          git apply "$RUNNER_TEMP/tested-cleanup/cleanup.patch"
          git diff --check
          test "$(git diff --name-only)" = test/python/circuit/test_commutation_checker.py
          git config user.name 'Sankalp Thakur'
          git config user.email 'sankalphimself@gmail.com'
          git add test/python/circuit/test_commutation_checker.py
          git commit -m 'Parameterize duplicate-qubit regression cases'
          test "$(git rev-parse HEAD^)" = "$expected"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          printf 'Updated PR branch to `%s` after exact-source tests. No merge or force-push.\n' "$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
